[project]
name = "scm-backend"
version = "0.1.0"
description = "Backend skeleton for Social Cleanup Machine"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<0.116",
  "jsonschema>=4.23,<5",
  "langdetect>=1.0.9,<2",
  "openai>=2.2,<3",
  "psycopg[binary]>=3.2,<3.3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "coverage>=7.6,<8",
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = [
  "app/language",
  "app/llm",
  "app/models",
  "app/repositories",
  "app/services",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
