services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scm}
      POSTGRES_USER: ${POSTGRES_USER:-scm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scm}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCM_DATABASE_URL: ${SCM_DATABASE_URL:-postgresql+psycopg://scm:scm@db:5432/scm}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "4173:80"

volumes:
  postgres_data:
